name: windows-local-hosting

on:
  push:
    branches:
      - nick/windows-local-hosting
    paths:
      - .github/workflows/windows-local-hosting.yml
      - scripts/windows/**
      - infra/cloudflare-relay/**
      - docs/windows-local-hosting.md
      - src/**
      - scripts/start-hosted.js
      - package.json
      - package-lock.json
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/windows-local-hosting.yml
      - scripts/windows/**
      - infra/cloudflare-relay/**
      - docs/windows-local-hosting.md
      - src/**
      - scripts/start-hosted.js
      - package.json
      - package-lock.json

permissions:
  contents: read

jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install and test Cloudflare relay
        shell: pwsh
        run: |
          npm ci --prefix infra/cloudflare-relay
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test --prefix infra/cloudflare-relay
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Parse Windows PowerShell scripts
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem scripts\windows\*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "Parser errors in $($_.FullName):"
              $errors | ForEach-Object { Write-Host $_.Message }
            }
          }
          if ($failed) { exit 1 }

      - name: DPAPI import and hosted runtime smoke
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:GITHUB_WORKSPACE
          $runtime = Join-Path $env:RUNNER_TEMP 'nick-drive-mcp-smoke'
          New-Item -ItemType Directory -Path $runtime -Force | Out-Null

          $input = Join-Path $runtime 'google-web.json'
          $secretPath = Join-Path $runtime 'hosted-secrets.json'
          $storePath = Join-Path $runtime 'team-store.json'
          $fixture = @{
            web = @{
              client_id = 'ci.apps.googleusercontent.com'
              client_secret = 'ci-secret-never-persist-plaintext'
            }
          }
          $fixture | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $input -Encoding UTF8

          & .\scripts\windows\import-google-web-credentials.ps1 -InputPath $input -OutputPath $secretPath -DeleteSource
          if (-not (Test-Path -LiteralPath $secretPath)) { throw 'Protected secret file was not created.' }
          if (Test-Path -LiteralPath $input) { throw 'Source credentials file was not deleted.' }
          if ((Get-Content -LiteralPath $secretPath -Raw) -match 'ci-secret-never-persist-plaintext') {
            throw 'Client secret leaked into the protected credential file in plaintext.'
          }

          $nodePath = (Get-Command node.exe).Source
          $runner = Join-Path $root 'scripts\windows\run-local-host.ps1'
          $args = @(
            '-NoLogo', '-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass',
            '-File', ('"' + $runner + '"'),
            '-RepoPath', ('"' + $root + '"'),
            '-IssuerUrl', 'https://drive-mcp.example.invalid',
            '-NodePath', ('"' + $nodePath + '"'),
            '-Port', '18942',
            '-SecretPath', ('"' + $secretPath + '"'),
            '-StorePath', ('"' + $storePath + '"'),
            '-TrustProxyHops', '1'
          ) -join ' '

          $proc = Start-Process powershell.exe -ArgumentList $args -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Seconds 1
              try {
                Invoke-WebRequest -Uri 'http://127.0.0.1:18942/mcp' -Method Get -Headers @{ Accept = 'text/event-stream' } -UseBasicParsing -TimeoutSec 2 -ErrorAction Stop | Out-Null
              } catch {
                if ($_.Exception.Response -and [int]$_.Exception.Response.StatusCode -eq 401) {
                  $ready = $true
                  break
                }
              }
            }
            if (-not $ready) { throw 'Hosted runtime never returned the expected unauthenticated HTTP 401.' }
            if (-not (Test-Path -LiteralPath $storePath)) { throw 'File-backed team store was not created.' }
          } finally {
            cmd /c "taskkill /PID $($proc.Id) /T /F" | Out-Null
          }

          Start-Sleep -Seconds 1
          $listener = Get-NetTCPConnection -LocalPort 18942 -State Listen -ErrorAction SilentlyContinue
          if ($listener) { throw 'Hosted runtime process tree was not fully cleaned up.' }

      - name: Scheduled Task persistence smoke
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:GITHUB_WORKSPACE
          $runtime = Join-Path $env:RUNNER_TEMP 'nick-drive-mcp-smoke'
          $secretPath = Join-Path $runtime 'hosted-secrets.json'
          $taskRuntime = Join-Path $runtime 'scheduled'
          $taskStore = Join-Path $taskRuntime 'team-store.json'
          $taskName = 'Nick Drive MCP CI'
          New-Item -ItemType Directory -Path $taskRuntime -Force | Out-Null

          try {
            & .\scripts\windows\install-local-host.ps1 `
              -RepoPath $root `
              -IssuerUrl 'https://drive-mcp.example.invalid' `
              -Port 18943 `
              -TrustProxyHops 1 `
              -TaskName $taskName `
              -SecretPath $secretPath `
              -StorePath $taskStore `
              -SkipBuild `
              -StartNow

            $task = Get-ScheduledTask -TaskName $taskName -ErrorAction Stop
            if ([string]$task.Principal.RunLevel -ne 'Limited') {
              throw "Scheduled Task unexpectedly requests elevated privileges: $($task.Principal.RunLevel)"
            }
            if (-not (Test-Path -LiteralPath $taskStore)) {
              throw 'Scheduled Task runtime did not create its file-backed team store.'
            }
          } finally {
            & .\scripts\windows\remove-local-host.ps1 `
              -TaskName $taskName `
              -SecretPath $secretPath `
              -StorePath $taskStore `
              -Confirm:$false
          }

          Start-Sleep -Seconds 2
          if (Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue) {
            throw 'Scheduled Task was not removed during cleanup.'
          }
          $listener = Get-NetTCPConnection -LocalPort 18943 -State Listen -ErrorAction SilentlyContinue
          if ($listener) {
            Write-Host '=== Remaining listener evidence ==='
            $listener | Select-Object LocalAddress, LocalPort, OwningProcess, State | Format-List | Out-String | Write-Host
            foreach ($ownerPid in @($listener.OwningProcess | Select-Object -Unique)) {
              $process = Get-CimInstance Win32_Process -Filter "ProcessId = $ownerPid" -ErrorAction SilentlyContinue
              if ($process) {
                $process | Select-Object ProcessId, ParentProcessId, Name, ExecutablePath, CommandLine | Format-List | Out-String | Write-Host
                $parent = Get-CimInstance Win32_Process -Filter "ProcessId = $($process.ParentProcessId)" -ErrorAction SilentlyContinue
                if ($parent) {
                  Write-Host '=== Parent process evidence ==='
                  $parent | Select-Object ProcessId, ParentProcessId, Name, ExecutablePath, CommandLine | Format-List | Out-String | Write-Host
                }
              }
            }
            throw 'Scheduled Task process tree was not fully stopped during cleanup.'
          }
      - name: Orphaned hosted runtime cleanup smoke
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:GITHUB_WORKSPACE
          $runtime = Join-Path $env:RUNNER_TEMP 'nick-drive-mcp-smoke'
          $secretPath = Join-Path $runtime 'hosted-secrets.json'
          $orphanRuntime = Join-Path $runtime 'orphan-runtime'
          $storePath = Join-Path $orphanRuntime 'team-store.json'
          New-Item -ItemType Directory -Path $orphanRuntime -Force | Out-Null
          $nodePath = (Get-Command node.exe).Source
          $runner = Join-Path $root 'scripts\windows\run-local-host.ps1'
          $args = @(
            '-NoLogo', '-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass',
            '-File', ('"' + $runner + '"'),
            '-RepoPath', ('"' + $root + '"'),
            '-IssuerUrl', 'https://drive-mcp.example.invalid',
            '-NodePath', ('"' + $nodePath + '"'),
            '-Port', '18944',
            '-SecretPath', ('"' + $secretPath + '"'),
            '-StorePath', ('"' + $storePath + '"'),
            '-TrustProxyHops', '1'
          ) -join ' '
          $proc = Start-Process powershell.exe -ArgumentList $args -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Seconds 1
              try {
                Invoke-WebRequest -Uri 'http://127.0.0.1:18944/mcp' -Method Get -Headers @{ Accept = 'text/event-stream' } -UseBasicParsing -TimeoutSec 2 -ErrorAction Stop | Out-Null
              } catch {
                if ($_.Exception.Response -and [int]$_.Exception.Response.StatusCode -eq 401) {
                  $ready = $true
                  break
                }
              }
            }
            if (-not $ready) { throw 'Orphan runtime fixture never reached HTTP 401.' }

            & .\scripts\windows\remove-local-host.ps1 `
              -TaskName 'Nick Drive MCP Missing CI' `
              -RepoPath $root `
              -SecretPath $secretPath `
              -StorePath $storePath `
              -Confirm:$false

            Start-Sleep -Seconds 1
            if (Get-NetTCPConnection -LocalPort 18944 -State Listen -ErrorAction SilentlyContinue) {
              throw 'Orphan hosted runtime listener remained after exact cleanup.'
            }
            $comparison = [System.StringComparison]::OrdinalIgnoreCase
            $launcher = Join-Path $root 'scripts\start-hosted.js'
            $entrypoint = Join-Path $root 'dist\index.js'
            $remaining = @(
              Get-CimInstance Win32_Process -Filter "Name = 'node.exe'" -ErrorAction SilentlyContinue |
                Where-Object {
                  $line = [string]$_.CommandLine
                  $line.IndexOf($launcher, $comparison) -ge 0 -or $line.IndexOf($entrypoint, $comparison) -ge 0
                }
            )
            if ($remaining.Count -gt 0) { throw 'Orphan hosted Node runtime remained after exact cleanup.' }
          } finally {
            if (Get-Process -Id $proc.Id -ErrorAction SilentlyContinue) {
              cmd /c "taskkill /PID $($proc.Id) /T /F" | Out-Null
            }
          }

      - name: Orphaned relay runner cleanup smoke
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:GITHUB_WORKSPACE
          $nodePath = (Get-Command node.exe).Source
          $runner = Join-Path $root 'infra\cloudflare-relay\src\bridge-runner.mjs'
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = $nodePath
          $psi.Arguments = '"' + $runner + '"'
          $psi.UseShellExecute = $false
          $psi.CreateNoWindow = $true
          $psi.EnvironmentVariables['DRIVE_RELAY_URL'] = 'ws://127.0.0.1:9/__relay/ws'
          $psi.EnvironmentVariables['DRIVE_RELAY_KEY'] = 'ci-relay-key-0123456789abcdef0123456789abcdef'
          $psi.EnvironmentVariables['DRIVE_RELAY_LOCAL_ORIGIN'] = 'http://127.0.0.1:18944'
          $psi.EnvironmentVariables['DRIVE_RELAY_LOG_LEVEL'] = 'error'
          $proc = [System.Diagnostics.Process]::Start($psi)
          try {
            Start-Sleep -Seconds 2
            if ($proc.HasExited) { throw 'Orphan relay fixture exited before cleanup could be tested.' }

            & .\scripts\windows\remove-relay-client.ps1 `
              -TaskName 'Nick Drive MCP Relay Missing CI' `
              -RepoPath $root `
              -Confirm:$false

            Start-Sleep -Seconds 1
            if (-not $proc.HasExited) { throw 'Orphan relay runner remained after exact cleanup.' }
            $comparison = [System.StringComparison]::OrdinalIgnoreCase
            $remaining = @(
              Get-CimInstance Win32_Process -Filter "Name = 'node.exe'" -ErrorAction SilentlyContinue |
                Where-Object { ([string]$_.CommandLine).IndexOf($runner, $comparison) -ge 0 }
            )
            if ($remaining.Count -gt 0) { throw 'Orphan relay Node process remained after exact cleanup.' }
          } finally {
            if (-not $proc.HasExited) { cmd /c "taskkill /PID $($proc.Id) /T /F" | Out-Null }
          }
