name: one-shot-drive-search-contract-fix

on:
  push:
    branches:
      - nick/openai-drive-parity
    paths:
      - .github/workflows/one-shot-drive-search-contract-fix.yml

permissions:
  contents: write

jobs:
  patch-drive-search-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nick/openai-drive-parity
          fetch-depth: 0
      - name: Patch stale upstream search expectation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('test/integration/drive.test.ts')
          s = p.read_text()
          old = """    it('validation error on empty args', async () => {\n      const res = await callTool(ctx.client, 'search', {});\n      assert.equal(res.isError, true);\n    });\n"""
          new = """    it('empty args browse Drive in OpenAI-compatible mode', async () => {\n      ctx.mocks.drive.service.files.list._setImpl(async () => ({ data: { files: [] } }));\n      const res = await callTool(ctx.client, 'search', {});\n      assert.equal(res.isError, false);\n      const listCalls = ctx.mocks.drive.tracker.getCalls('files.list');\n      assert.ok(listCalls.length >= 1);\n    });\n\n    it('explicit empty query still fails validation', async () => {\n      const res = await callTool(ctx.client, 'search', { query: '' });\n      assert.equal(res.isError, true);\n    });\n"""
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one stale block, found {count}')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/integration/drive.test.ts
          git diff --cached --check
          git commit -m 'test: align Drive search empty-args contract with OpenAI parity'
          git push origin HEAD:nick/openai-drive-parity
